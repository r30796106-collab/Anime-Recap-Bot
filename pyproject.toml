[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-recap-bot"
version = "0.1.0"
description = "Modular Hindi anime recap video production pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
voice = ["kokoro>=0.9.4", "soundfile>=0.12"]

[project.scripts]
anime-recap = "anime_recap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anime_recap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
